<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoBusca</title>
    <link rel="icon" type="image/png" href="icons/icon_512x512.png">
    <link rel="stylesheet" href="style.css">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GeoBusca">
    <link rel="apple-touch-icon" href="icons/icon_192x192.png">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <!-- cabeçalho -->
    <header>
        <h1>GeoBusca</h1>
    </header>

    <h2>Localizador de indereços brasileiros via CEP</h2>

    <!-- Formulário de consulta -->
    <form id="formConsulta">

        <h3>Para localizar, digite o CEP e Cidade:</h3>

        <label for="cep">CEP</label>
        <input id="cep" type="text" inputmode="numeric" maxlength="9" placeholder="Ex: 12345-678" required>
        <label for="cidade">Cidade</label>
        <input id="cidade" type="text" placeholder="Ex: Lages" required>
        <button type="submit">Buscar</button>

    </form>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2026 GeoBusca. João M. G. Godinho</p>
    </footer>

    <p id="mensagem" role="status" aria-live="polite"></p>
    <script src="index.js"></script>
    <script src="script.js"></script>


    <!-- 88512-210 Cep teste -->

</body>

</html>
